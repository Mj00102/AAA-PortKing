<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="AAA端口大王">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="880" height="200" rx="16" fill="url(#bg)"/>

  <!-- 端口插头图标 -->
  <g transform="translate(60,50)">
    <rect x="0" y="34" width="86" height="60" rx="12" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <line x1="22" y1="12" x2="22" y2="34" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="64" y1="12" x2="64" y2="34" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="43" cy="64" r="9" fill="#38bdf8"/>
  </g>

  <text x="185" y="96" font-family="'Microsoft YaHei UI','Segoe UI',sans-serif" font-size="62" font-weight="700" fill="#f8fafc">AAA端口大王</text>
  <text x="188" y="140" font-family="'Segoe UI',sans-serif" font-size="21" fill="#94a3b8">Windows 端口进程一键查看 · Ctrl+左键开浏览器 · 一键停服务</text>

  <!-- 右侧装饰端口号 -->
  <text x="700" y="130" font-family="'Consolas',monospace" font-size="72" font-weight="700" fill="#1e3a5f">:8080</text>
</svg>
